<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 유니버스</title>
<style>
  /* 어두운 녹색 배경 + 파스텔 노드 색. 그래프 색은 app/src/ui/graph.js의 TYPE_COLORS */
  :root { --bg: #0f1510; --panel: #141c15; --panel-2: #1b251c; --line: #2a3a2b; --text: #e6ecdf; --muted: #8f9d88; --accent: #a6d86b; --accent-ink: #13200f; --err: #ff8f86; --ok: #9be39f; --warn-bg: #3a3214; --warn-text: #f2dc8e; --chip: #243226; --link: #b9e07a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  header h1 b { color: var(--accent); }
  #universe-picker { border-radius: 999px; padding: 6px 12px; max-width: 420px; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid #3c5a33; background: var(--panel-2); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary, form button[type=submit] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: bold; }
  #banner { margin: 0; padding: 10px 16px; background: var(--warn-bg); color: var(--warn-text); border-bottom: 1px solid #5a4c1c; font-size: 14px; }
  main { flex: 1; display: flex; min-height: 0; }
  .graph-wrap { flex: 1; min-width: 0; position: relative; background: radial-gradient(ellipse at 50% 45%, #17231a 0%, var(--bg) 70%); display: flex; flex-direction: column; }
  #graph { flex: 1; min-height: 0; position: relative; }
  .graph-tools { position: absolute; top: 12px; right: 12px; z-index: 1; display: flex; gap: 6px; }
  #legend { margin: 0; padding: 8px 14px; list-style: none; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  #legend li { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.ref { background: transparent; border: 2px dashed var(--muted); }
  .legend-note { color: var(--muted); }
  aside { width: 380px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; }
  aside h2 { font-size: 17px; margin: 0 0 10px; }
  aside h3 { font-size: 14px; margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--accent); }
  dl { display: grid; grid-template-columns: 76px 1fr; gap: 5px 8px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  ul, ol { padding-left: 0; margin: 0; font-size: 14px; list-style: none; }
  .links li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .links li:last-child { border-bottom: 0; }
  .arrow { margin: 0 4px; color: var(--muted); }
  .history li { display: grid; grid-template-columns: 82px auto 1fr; gap: 2px 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); align-items: start; }
  .history li:last-child { border-bottom: 0; }
  .history time { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .history .chip { justify-self: start; }
  .history .text { grid-column: 1 / -1; }
  .chip { display: inline-block; background: var(--chip); border: 1px solid #34482f; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 16px; padding: 10px; background: var(--panel-2); border-radius: 8px; }
  .notice { background: var(--warn-bg); color: var(--warn-text); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin: 0 0 10px; }
  button.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; font: inherit; border-radius: 0; }
  details.add { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  details.add summary { cursor: pointer; font-size: 14px; font-weight: bold; }
  form { display: grid; gap: 8px; font-size: 14px; margin-top: 10px; }
  form label { display: grid; gap: 4px; color: var(--muted); }
  input, select { font: inherit; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #add-message.error { color: var(--err); }
  #add-message.ok { color: var(--ok); }
  .dot.collapsed { background: transparent; border: 3px double var(--muted); }
  .layer { margin: 12px 0 0; padding: 10px; background: var(--panel-2); border-radius: 8px; display: grid; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
  .checks { display: grid; gap: 6px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(460px, calc(100vw - 32px)); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 6px; font-size: 17px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  legend { color: var(--muted); font-size: 13px; padding: 0 4px; }
  .error-text { color: var(--err); font-size: 13px; min-height: 1em; }
  .editor { display: grid; gap: 8px; font-size: 14px; min-width: 0; }
  .editor select, .editor input:not([type=checkbox]), .editor textarea { width: 100%; min-width: 0; max-width: 100%; }
  aside { overflow-x: hidden; }
  .editor h3 { margin: 4px 0; border: 0; padding: 0; }
  .field { display: grid; gap: 4px; }
  .field > span { color: var(--muted); font-size: 13px; }
  textarea { font: inherit; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .attr-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
  .attr-row input { min-width: 0; }
  .period input { flex: 1; min-width: 0; }
  .small-btn { padding: 2px 10px; font-size: 12px; }
  .danger { border-color: #6b3434; }
  .danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
  .toolbar { margin: -2px 0 10px; }
  .links li { position: relative; }
  .link-tools { position: absolute; top: 4px; right: 0; display: none; background: var(--panel); padding-left: 6px; }
  .links li:hover .link-tools, .links li:focus-within .link-tools { display: flex; }
  .form-message.error { color: var(--err); font-size: 13px; }
  .ok-text { color: var(--ok); font-size: 13px; margin: 0 0 8px; }
  .draft-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .badge { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 1px 10px; font-size: 12px; font-weight: bold; }
  .method { color: var(--muted); font-size: 13px; flex: 1; }
  .draft-title { margin: 6px 0 10px; border: 0; padding: 0; color: var(--text); }
  .draft-item { border-top: 1px dashed var(--line); padding: 8px 0; }
  .draft-item h4 { margin: 0 0 4px; font-size: 14px; color: var(--accent); }
  .draft-item ul { display: grid; gap: 6px; }
  .draft-item li { display: grid; gap: 3px; }
  .draft-item.insufficient h4 { color: var(--muted); }
  .evidence-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .evidence { padding: 0 8px; font-size: 11px; border-radius: 8px; color: var(--muted); }
  .copy-box { width: 100%; margin-top: 8px; }
  .insight .field select, .draft .field select { width: 100%; max-width: 100%; min-width: 0; }
  .experts { display: grid; gap: 12px; margin-top: 8px; padding: 0; }
  .experts > li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
  .who { display: flex; align-items: center; gap: 6px; }
  .who .chip { margin-left: auto; }
  .why { display: grid; gap: 2px; }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 50vh; } .graph-wrap { min-height: 320px; } }
</style>
</head>
<body>
<header>
  <h1>업무 <b>UNIVERSE</b></h1>
  <select id="universe-picker" aria-label="유니버스 선택"></select>
  <span class="spacer"></span>
  <button type="button" id="group-open" class="primary">유니버스 묶기</button>
  <button type="button" id="reset">가상 데이터 초기화</button>
</header>
<p id="banner" role="alert" hidden></p>
<main>
  <div class="graph-wrap">
    <div id="graph" aria-label="그래프"></div>
    <div class="graph-tools"><button type="button" id="relayout" title="노드 배치를 처음부터 다시 계산합니다">다시 정렬</button><button type="button" id="fit">전체 보기</button></div>
    <ul id="legend" aria-label="범례"></ul>
  </div>
  <aside>
    <section id="detail" aria-live="polite"></section>
    <details class="add">
      <summary>노드 추가</summary>
      <div id="add-slot"></div>
    </details>
  </aside>
</main>
<dialog id="group-dialog" aria-labelledby="group-title">
  <form id="group-form" novalidate>
    <h2 id="group-title">유니버스 묶기</h2>
    <p class="muted small">고른 유니버스를 꼭지 참조로 묶어 상위 유니버스를 만듭니다. 원래 유니버스는 바뀌지 않습니다.</p>
    <label>이름 <input id="group-name" maxlength="100" autocomplete="off" placeholder="예: 가상 신규팀"></label>
    <label>단위 <input id="group-level" list="group-levels" value="팀" autocomplete="off"></label>
    <datalist id="group-levels"><option value="팀"><option value="부서"><option value="본부"><option value="회사"><option value="프로젝트"></datalist>
    <label>작성 주체 <input id="group-owner" autocomplete="off" placeholder="예: 가상 운영부"></label>
    <fieldset><legend>묶을 유니버스(2개 이상)</legend><div id="group-children" class="checks"></div></fieldset>
    <div id="group-message" class="error-text" aria-live="polite"></div>
    <div class="row"><button type="submit">묶기</button><button type="button" id="group-cancel">취소</button></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
